version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ai-sahayak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_sahayak
      POSTGRES_USER: ai_sahayak_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_sahayak_user -d ai_sahayak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI-Sahayak Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-sahayak-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://ai_sahayak_user:${DB_PASSWORD:-change_this_password}@db:5432/ai_sahayak
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      BYTEZ_API_KEY: ${BYTEZ_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_change_in_production}
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
      NODE_ENV: production
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: ai-sahayak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: ai-sahayak-network
